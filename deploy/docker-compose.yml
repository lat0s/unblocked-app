# The live demo on Coolify (build pack dockercompose, base directory /deploy).
# Static UI only: no backend, no secrets, no AI.
services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 64m
